# Intégration continue : typage, lint, tests (PGlite), migrations sur PostgreSQL réel, build.
# Non exécutée à ce jour (pas de dépôt distant). À activer lors de la publication du dépôt.
name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gestion_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          PASSWORD_SCRYPT_LOG_N: "14"
      - name: Migrations sur PostgreSQL serveur
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/gestion_ci
      - run: npm run build
